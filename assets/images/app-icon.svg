<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A4C" />
      <stop offset="100%" stop-color="#1B3B32" />
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B89D" />
      <stop offset="100%" stop-color="#E29272" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8CBB0" />
      <stop offset="100%" stop-color="#7FA888" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base: Squircle / Rounded Container -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#4A7566" stroke-width="1.5" />

  <!-- Subtle Inner Ambient Aura -->
  <circle cx="60" cy="62" r="38" fill="#3A6B5B" opacity="0.4" filter="url(#softGlow)" />

  <!-- Stylized Mother & Child / Maternal Care Silhouette -->
  <!-- Outer Nurturing Embrace: Mother's head & curving arm protecting child -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mother Head -->
    <circle cx="48" cy="36" r="9" fill="url(#peachGrad)" />

    <!-- Protective Flow / Shoulder & Back into cradling arm -->
    <path d="M42 45 C34 50 30 62 31 74 C32 84 41 93 54 94 C68 95 80 88 84 76 C86 70 85 64 81 59 C76 53 68 50 63 52 C57 54 55 60 56 66 C57 71 61 74 65 74 C69 74 72 71 72 67" 
          stroke="url(#sageGrad)" stroke-width="4.5" />

    <!-- Inner Life / Developing Fetal Heartbeat & Spark of Life -->
    <path d="M57 68 C57 63 61 60 65 60 C68 60 70 62 70 65 C70 70 62 75 60 78 C58 75 54 71 54 67 C54 63 57 60 60 60 C61.5 60 63 61 64 62.5"
          fill="url(#peachGrad)" opacity="0.9" />

    <!-- Gentle Caring Hands Base Accent -->
    <path d="M38 78 C43 85 52 88 62 86 C70 84 76 79 79 73" 
          stroke="#F4D2C1" stroke-width="2.5" stroke-dasharray="0.5 3" opacity="0.7" />

    <!-- Subtle Connection Pulse / Care Arc -->
    <path d="M36 34 C44 26 62 25 74 32 C84 38 90 49 90 60" 
          stroke="#95BCA0" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
